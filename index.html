  <style>
    :root {
      --background:#faf7ef; --foreground:#342d29; --primary-foreground:#fffaf0;
      --muted-foreground:#817267; --caramel:#ba8450; --caramel-deep:#8a5b32;
      --ink:#332d2a; --border:rgba(144,117,87,.22);
      --shadow-warm:0 20px 60px -20px rgba(119,78,38,.33);
      --shadow-soft:0 8px 28px -12px rgba(119,78,38,.23);
      --line:#06C755; --line-hover:#05b34c;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--background);color:var(--foreground);
      font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    h1,h2{font-family:"Noto Serif TC","Songti TC",serif;letter-spacing:.01em}
    .page{width:min(100%,440px);min-height:100vh;margin:0 auto;background:var(--background);overflow:hidden}
    .hero{position:relative}
    .hero-media{position:relative;overflow:hidden;height:78vh;min-height:520px;max-height:720px}
    .hero-media img{display:block;width:100%;height:100%;object-fit:cover}
    .hero-media::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(to bottom,rgba(250,247,239,0) 0%,rgba(250,247,239,0) 43%,rgba(250,247,239,.50) 76%,var(--background) 100%)}
    .hero-badges{position:absolute;top:20px;left:20px;right:20px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .badge{border-radius:999px;padding:7px 12px;background:rgba(51,45,42,.20);color:rgba(255,250,240,.92);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11px;line-height:1;white-space:nowrap}
    .badge:first-child{letter-spacing:.3em;text-transform:uppercase;font-weight:500}
    .hero-copy{position:relative;z-index:3;margin-top:-80px;padding:0 24px;text-align:center;animation:floatUp .8s ease-out both}
    .eyebrow{margin:0 0 12px;color:var(--caramel-deep);font-size:14px;letter-spacing:.25em}
    h1{margin:0;color:var(--ink);font-size:32px;line-height:1.3;text-wrap:balance}
    h1 .accent{color:var(--caramel-deep)}
    .cta-wrap{margin-top:24px}
    .primary-cta{display:inline-flex;width:100%;align-items:center;justify-content:center;border-radius:999px;
      background:var(--line);color:#fff;box-shadow:var(--shadow-warm);padding:16px 24px;font-size:16px;font-weight:500;
      transition:transform .18s ease,background .18s ease}
    .primary-cta:hover{background:var(--line-hover)} .primary-cta:active{transform:scale(.98)}
    .hint{margin:8px 0 0;color:var(--muted-foreground);font-size:12px}
    .poster-section{margin-top:48px;padding:0 24px}
    .poster-section a{display:block}
    .poster-section img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:var(--shadow-soft)}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease-out,transform .6s ease-out}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    .final{margin-top:56px;padding:0 24px 48px}
    .final-inner{padding:40px 24px;text-align:center}
    .limited{margin:0 0 12px;color:var(--caramel-deep);font-size:11px;letter-spacing:.4em}
    h2{margin:0;font-size:28px;line-height:1.42;text-wrap:balance;color:var(--ink)}
    .final-copy{margin:12px 0 0;color:var(--muted-foreground);font-size:14px;line-height:1.7}
    .final-cta{margin-top:28px;display:inline-flex;width:100%;align-items:center;justify-content:center;border-radius:999px;
      background:var(--ink);color:var(--primary-foreground);padding:16px 24px;font-weight:500;transition:transform .18s ease}
    .final-cta:active{transform:scale(.98)}
    .scarcity{margin:12px 0 0;color:var(--muted-foreground);font-size:11px}
    .footer-line{margin:16px 0 0;text-align:center;color:var(--muted-foreground);font-size:11px;letter-spacing:.08em}
    .footer-line.last{margin-top:8px;opacity:.7}
    @keyframes floatUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
    @media (max-width:380px){h1{font-size:29px}.hero-copy{padding:0 20px}.poster-section,.final{padding-left:20px;padding-right:20px}}
      .company-info{padding:0 24px 32px}
    .company-inner{border-top:1px solid var(--border);padding-top:20px;text-align:center}
    .company-label{font-size:11px;color:var(--muted-foreground);letter-spacing:.15em;margin-bottom:6px}
    .company-detail{font-size:11px;color:var(--muted-foreground);line-height:1.8}
